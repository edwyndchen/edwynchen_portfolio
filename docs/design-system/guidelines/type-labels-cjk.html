<!-- @dsCard group="Type" viewport="700x160" name="Labels & Chinese" subtitle="Letterspaced eyebrows + Ma Shan Zheng couplets" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--paper-50);color:var(--text-primary);padding:24px 28px;display:flex;gap:40px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 14px;font-family:var(--font-sans)}
  .eye{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-brand);display:block;margin-bottom:10px}
  .eye.dim{color:var(--text-secondary)}
  .cjk{font-family:var(--font-cjk);color:var(--text-brand)}
  .cjk .big{font-size:30px;font-weight:500;display:block;line-height:1.5}
  .cjk .cap{font-family:var(--font-sans);font-size:11px;color:var(--text-secondary);margin-top:8px;display:block}
</style></head><body>
<div style="flex:1">
  <p class="lbl">Eyebrows / labels</p>
  <span class="eye">DIGITAL DESIGNER</span>
  <span class="eye dim">SELECTED WORK</span>
  <span class="eye dim">CAPABILITIES</span>
</div>
<div style="flex:1" class="cjk">
  <p class="lbl">Chinese · Ma Shan Zheng</p>
  <span class="big">以简驭繁</span>
  <span class="big">匠心如一</span>
  <span class="cap">Govern complexity with simplicity · craft, constant as one</span>
</div>
</body></html>
