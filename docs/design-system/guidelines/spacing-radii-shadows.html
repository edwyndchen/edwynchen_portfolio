<!-- @dsCard group="Spacing" viewport="700x180" name="Radii & Shadows" subtitle="Restrained corners · soft cool-tinted porcelain shadows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--paper-50);font-family:var(--font-sans);padding:24px 28px;display:flex;gap:34px}
  .set{flex:1}
  .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 16px}
  .row{display:flex;gap:16px;align-items:flex-end}
  .box{width:66px;height:66px;background:var(--paper-0);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10px;color:var(--text-secondary)}
  .r-sm{border-radius:var(--radius-sm);box-shadow:var(--shadow-inset-hairline)}
  .r-xs{border-radius:var(--radius-xs);box-shadow:var(--shadow-inset-hairline)}
  .r-md{border-radius:var(--radius-md);box-shadow:var(--shadow-inset-hairline)}
  .r-lg{border-radius:var(--radius-lg);box-shadow:var(--shadow-inset-hairline)}
  .sh{border-radius:var(--radius-md)}
</style></head><body>
<div class="set">
  <p class="lbl">Radii</p>
  <div class="row">
    <div class="box r-sm">0</div><div class="box r-xs">4</div><div class="box r-md">8</div><div class="box r-lg">12</div>
  </div>
</div>
<div class="set">
  <p class="lbl">Shadows</p>
  <div class="row">
    <div class="box sh" style="box-shadow:var(--shadow-sm)">sm</div>
    <div class="box sh" style="box-shadow:var(--shadow-md)">md</div>
    <div class="box sh" style="box-shadow:var(--shadow-lg)">lg</div>
  </div>
</div>
</body></html>
