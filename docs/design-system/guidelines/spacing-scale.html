<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base · generous exhibition rhythm" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--paper-50);font-family:var(--font-sans);padding:22px 28px}
  .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 14px}
  .r{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .bar{height:14px;background:var(--blue-700);border-radius:2px}
  .n{font-size:11px;color:var(--text-secondary);width:130px;font-variant-numeric:tabular-nums}
</style></head><body>
<p class="lbl">Spacing tokens</p>
<div class="r"><span class="n">--space-2 · 8px</span><div class="bar" style="width:8px"></div></div>
<div class="r"><span class="n">--space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
<div class="r"><span class="n">--space-5 · 24px</span><div class="bar" style="width:24px"></div></div>
<div class="r"><span class="n">--space-6 · 32px</span><div class="bar" style="width:32px"></div></div>
<div class="r"><span class="n">--space-7 · 48px</span><div class="bar" style="width:48px"></div></div>
<div class="r"><span class="n">--space-8 · 64px</span><div class="bar" style="width:64px"></div></div>
<div class="r"><span class="n">--space-10 · 128px</span><div class="bar" style="width:128px"></div></div>
</body></html>
