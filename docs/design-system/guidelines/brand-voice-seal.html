<!-- @dsCard group="Brand" viewport="700x180" name="Voice & Seal" subtitle="Taglines, tone words, and the seal stamp motif" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--paper-50);padding:26px 30px;display:flex;gap:32px;align-items:center;font-family:var(--font-sans)}
  .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 12px}
  .quote{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:26px;line-height:1.25;color:var(--ink-900);margin:0}
  .words{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
  .w{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-brand);border:1px solid var(--border-default);border-radius:var(--radius-round);padding:5px 12px}
  .seal{width:fit-content;height:fit-content;border-radius:var(--radius-xs);background:transparent;border:2px solid var(--seal-500);color:var(--seal-500);font-family:'Ma Shan Zheng',var(--font-cjk);font-weight:400;display:grid;place-items:center;font-size:72px;line-height:1;padding:12px 16px 16px}
  .seal span{display:grid;place-items:center;width:72px;height:82px}
</style></head><body>
<div style="flex:1">
  <p class="lbl">Voice</p>
  <p class="quote">Good design is the bridge<br>between culture and clarity.</p>
  <div class="words"><span class="w">Heritage</span><span class="w">Refined</span><span class="w">Modern</span><span class="w">Intentional</span></div>
</div>
<div style="text-align:center">
  <p class="lbl">Seal 印章</p>
  <div class="seal"><span>陳</span></div>
</div>
</body></html>
