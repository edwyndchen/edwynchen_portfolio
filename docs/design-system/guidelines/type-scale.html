<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="Display ladder (Cormorant) + sans steps (Manrope)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--paper-50);color:var(--text-primary);padding:22px 28px}
  .r{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--border-hairline);padding:7px 0}
  .r:last-child{border:0}
  .t{font-family:var(--font-display);font-weight:500;line-height:1;color:var(--ink-900)}
  .s{font-family:var(--font-sans);color:var(--ink-900)}
  .tok{margin-left:auto;font-family:var(--font-sans);font-size:11px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="r"><span class="t" style="font-size:44px">Display xl</span><span class="tok">--text-display-xl · 4rem</span></div>
<div class="r"><span class="t" style="font-size:30px">Display lg</span><span class="tok">--text-display-lg · 3rem</span></div>
<div class="r"><span class="t" style="font-size:22px">Display sm</span><span class="tok">--text-display-sm · 1.75rem</span></div>
<div class="r"><span class="s" style="font-size:18px">Body large</span><span class="tok">--text-lg · 1.125rem</span></div>
<div class="r"><span class="s" style="font-size:16px">Body / base</span><span class="tok">--text-md · 1rem</span></div>
<div class="r"><span class="s" style="font-size:14px">Small / UI</span><span class="tok">--text-sm · 0.875rem</span></div>
<div class="r"><span class="s" style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-secondary)">Label</span><span class="tok">--text-xs · 0.75rem</span></div>
</body></html>
