<!-- @dsCard group="Colors" viewport="900x170" name="Porcelain Cobalt" subtitle="Primary青花 blue scale (50→950) — 700 is the brand cobalt" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--paper-50);font-family:var(--font-sans);padding:22px;display:flex;flex-direction:column;gap:18px}
  .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 8px}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:82px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px;min-width:0}
  .sw span{font-size:10px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sw .hex{font-size:9px;opacity:.72;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="scale"><p class="lbl">--blue-50 → --blue-950</p><div class="row"><div class="sw" style="background:#eef2f9;color:var(--ink-900)"><span>50</span><span class="hex">#eef2f9</span></div><div class="sw" style="background:#dee6f2;color:var(--ink-900)"><span>100</span><span class="hex">#dee6f2</span></div><div class="sw" style="background:#c4d1e8;color:var(--ink-900)"><span>200</span><span class="hex">#c4d1e8</span></div><div class="sw" style="background:#9bb1d7;color:var(--ink-900)"><span>300</span><span class="hex">#9bb1d7</span></div><div class="sw" style="background:#6d8bc4;color:#fff"><span>400</span><span class="hex">#6d8bc4</span></div><div class="sw" style="background:#4269ad;color:#fff"><span>500</span><span class="hex">#4269ad</span></div><div class="sw" style="background:#33589a;color:#fff"><span>600</span><span class="hex">#33589a</span></div><div class="sw" style="background:#2b4c86;color:#fff"><span>700 ·brand</span><span class="hex">#2b4c86</span></div><div class="sw" style="background:#24406f;color:#fff"><span>800</span><span class="hex">#24406f</span></div><div class="sw" style="background:#1d2f52;color:#fff"><span>900</span><span class="hex">#1d2f52</span></div><div class="sw" style="background:#16233f;color:#fff"><span>950</span><span class="hex">#16233f</span></div></div></div>
</body></html>
