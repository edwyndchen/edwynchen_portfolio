<!-- @dsCard group="Colors" viewport="900x170" name="Porcelain Cobalt" subtitle="Primary青花 blue scale (50→950) — 700 is the brand cobalt" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--paper-50);font-family:var(--font-sans);padding:22px;display:flex;flex-direction:column;gap:18px}
  .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 8px}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:82px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px;min-width:0}
  .sw span{font-size:10px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sw .hex{font-size:9px;opacity:.72;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="scale"><p class="lbl">--blue-50 → --blue-950</p><div class="row"><div class="sw" style="background:#eeeffc;color:var(--ink-900)"><span>50</span><span class="hex">#eeeffc</span></div><div class="sw" style="background:#d8daf9;color:var(--ink-900)"><span>100</span><span class="hex">#d8daf9</span></div><div class="sw" style="background:#b7baf2;color:var(--ink-900)"><span>200</span><span class="hex">#b7baf2</span></div><div class="sw" style="background:#9598e6;color:var(--ink-900)"><span>300</span><span class="hex">#9598e6</span></div><div class="sw" style="background:#7375d7;color:#fff"><span>400</span><span class="hex">#7375d7</span></div><div class="sw" style="background:#5353c4;color:#fff"><span>500</span><span class="hex">#5353c4</span></div><div class="sw" style="background:#4241bb;color:#fff"><span>600</span><span class="hex">#4241bb</span></div><div class="sw" style="background:#3231b0;color:#fff"><span>700 ·brand</span><span class="hex">#3231b0</span></div><div class="sw" style="background:#1f1ca6;color:#fff"><span>800</span><span class="hex">#1f1ca6</span></div><div class="sw" style="background:#131095;color:#fff"><span>900</span><span class="hex">#131095</span></div><div class="sw" style="background:#0d0b45;color:#fff"><span>950</span><span class="hex">#0d0b45</span></div></div></div>
</body></html>
