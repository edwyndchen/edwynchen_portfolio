<?xml version="1.0" encoding="UTF-8"?>
<!-- Australian Aboriginal flag at its official 1:2 proportion (so it sits at exactly the Torres Strait Islander flag's size) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 6">
	<rect width="12" height="6" fill="#c00"/>
	<rect width="12" height="3"/>
	<circle cx="6" cy="3" r="1.5" fill="#ff0"/>
</svg>
